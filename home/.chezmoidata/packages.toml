[linux]
apt = [
    "fish",
    "tmux",
    "git",
    "curl",
    "make",
    "ripgrep",
    "jq",
    # language server for the clangd-lsp Claude Code plugin
    "clangd",
    # ccstatusline (Claude Code statusline) is an npm package
    "nodejs",
    "npm",
    "python3",
    "python3-pip",
    # pyenv build dependencies
    "build-essential",
    "libssl-dev",
    "zlib1g-dev",
    "libbz2-dev",
    "libreadline-dev",
    "libsqlite3-dev",
    "libncursesw5-dev",
    "xz-utils",
    "libffi-dev",
    "liblzma-dev",
    # runtime deps of the headless Chromium that Playwright and Puppeteer
    # download, as `playwright install-deps chromium` lists them
    "libasound2t64",
    "libatk-bridge2.0-0t64",
    "libatk1.0-0t64",
    "libatspi2.0-0t64",
    "libcairo2",
    "libcups2t64",
    "libdbus-1-3",
    "libdrm2",
    "libgbm1",
    "libglib2.0-0t64",
    "libnspr4",
    "libnss3",
    "libpango-1.0-0",
    "libx11-6",
    "libxcb1",
    "libxcomposite1",
    "libxdamage1",
    "libxext6",
    "libxfixes3",
    "libxkbcommon0",
    "libxrandr2",
    "xvfb",
    "fonts-noto-color-emoji",
    "fonts-unifont",
    "libfontconfig1",
    "libfreetype6",
    "xfonts-cyrillic",
    "xfonts-scalable",
    "fonts-liberation",
    "fonts-ipafont-gothic",
    "fonts-wqy-zenhei",
    "fonts-tlwg-loma-otf",
    "fonts-freefont-ttf",
]
